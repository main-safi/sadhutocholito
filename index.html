<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ইংরেজি ➔ সাধু ভাষা রূপান্তরক</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>সাধু ভাষা অনুবাদক ও অভিধান</h1>
      <p class="subtitle">English ➔ Sadhu Bhasha Translator</p>
    </header>

    <div class="panel active">
      <label for="english-input"><strong>English Text:</strong></label>
      <textarea id="english-input" placeholder="Enter English sentence (e.g., They are eating rice and reading books...)"></textarea>
      
      <button class="action-btn" onclick="handleEnglishToSadhuTranslation()">Translate to Sadhu Bhasha</button>

      <div class="output-box" id="sadhu-output">
        ফলাফল এখানে প্রদর্শিত হবে...
      </div>
    </div>
  </div>

  <script src="assets/js/rules.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
